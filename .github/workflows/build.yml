name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A pull request supersedes its own earlier run; a push to main must not cancel the
  # build that is about to publish artifacts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sites-check:
    name: Multi-site and upgrade check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Stubbed PocketBase: the registry, the per-site folders and the upgrade path are
      # proven in seconds, before the slower Windows build spends a runner on them.
      - name: Prove the upgrade path and a second site
        run: node scripts/verify-multisite.mjs

      # The panel's own ?site= rules, checked against the real Express app the phone and
      # the Windows folder serve rather than a copy of its logic.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install the panel's runtime dependencies
        run: node scripts/install-panel-deps.mjs

      - name: Prove the panel's ?site= handling
        run: node scripts/verify-panel-sites.mjs

  windows:
    name: Windows x64 (portable)
    runs-on: windows-latest
    needs: sites-check
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts plus an explicit installer: the old inline postinstall spawned
      # `npm` by name, which a Windows runner cannot resolve inside a lifecycle script.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install the panel's runtime dependencies
        run: node scripts/install-panel-deps.mjs

      - name: Download node.exe, pocketbase.exe and cloudflared.exe
        run: node scripts/fetch-windows-deps.mjs

      - name: Assemble the portable folder and its zip
        run: node scripts/pack-windows.mjs

      # The check that cannot be done from a Linux build machine: the real binaries,
      # on the real OS, driven through the launcher the user double-clicks.
      - name: Smoke test the real binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Start the packed folder exactly as the user will: its own node.exe, its own
          # pocketbase.exe beside it, its own data/ directory.
          $pack = 'dist\PocketServer-windows-x64'
          $data = Join-Path $pack 'data'
          $launcher = Start-Process -FilePath (Join-Path $pack 'node.exe') -ArgumentList (Join-Path $pack 'windows\launch.js'),'--no-open' -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 3
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:8080/api/health' -TimeoutSec 4
                if ($health.ok) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) {
              Get-ChildItem (Join-Path $data 'logs') -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host "--- $($_.Name) ---"
                Get-Content $_.FullName -Tail 40
              }
              throw 'The panel never answered on :8080'
            }
            Write-Host 'Panel is up on :8080'

            $pocketbaseUp = $false
            for ($i = 0; $i -lt 20; $i++) {
              try {
                $pb = Invoke-RestMethod 'http://127.0.0.1:8090/api/health' -TimeoutSec 4
                if ($pb.code -eq 200) { $pocketbaseUp = $true; break }
              } catch { }
              Start-Sleep -Seconds 3
            }
            if (-not $pocketbaseUp) {
              Get-Content (Join-Path $data 'logs\pocketbase.log') -Tail 40 -ErrorAction SilentlyContinue
              throw 'PocketBase never answered on :8090'
            }
            Write-Host 'PocketBase is up on :8090'

            $login = Invoke-RestMethod 'http://127.0.0.1:8080/api/login' -Method Post -ContentType 'application/json' -Body '{"pin":"1234"}'
            $headers = @{ 'X-Pocket-Token' = $login.token }
            $status = Invoke-RestMethod 'http://127.0.0.1:8080/api/status' -Headers $headers
            Write-Host "panel=$($status.status) port=$($status.port) site=$($status.sitePort)"
            if ($status.status -ne 'online') { throw "Unexpected panel status: $($status.status)" }

            Invoke-RestMethod 'http://127.0.0.1:8080/api/backup' -Method Post -Headers $headers | Out-Null
            $zip = $null
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 3
              $zip = Get-ChildItem (Join-Path $data 'pb_public\backups\*.zip') -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($zip) { break }
            }
            if (-not $zip) {
              Get-Content (Join-Path $data 'backup.status.json') -ErrorAction SilentlyContinue
              throw 'The backup never appeared'
            }
            Write-Host "backup $($zip.Name) $([math]::Round($zip.Length / 1KB)) KiB"

            $tunnel = Invoke-RestMethod 'http://127.0.0.1:8080/api/tunnel' -Headers $headers
            if (-not $tunnel.available) { throw 'The tunnel card reported unavailable although cloudflared is bundled' }
            Write-Host 'Tunnel card is available'
          }
          finally {
            if ($launcher -and -not $launcher.HasExited) { taskkill /PID $launcher.Id /T /F | Out-Null }
            Start-Sleep -Seconds 2
            Get-Process pocketbase, cloudflared -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      # The upgrade path with the real binaries: the data folder the first run wrote is
      # reused untouched, and a second site starts beside it on 8091.
      - name: Upgrade in place and add a second site
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pack = 'dist\PocketServer-windows-x64'
          $data = Join-Path $pack 'data'

          if (-not (Test-Path (Join-Path $data 'pb_data\data.db'))) { throw 'The first run left no database in data\pb_data' }
          $probe = Join-Path $data 'pb_data\upgrade-probe.txt'
          Set-Content -Path $probe -Value 'written before the second start' -NoNewline
          $oldBackup = Get-ChildItem (Join-Path $data 'pb_public\backups\*.zip') | Select-Object -First 1
          if (-not $oldBackup) { throw 'The backup from the first run is missing' }

          $registry = @{
            version = 1
            sites = @(
              @{ id = 'default'; name = 'Primary'; port = 8090; legacy = $true },
              @{ id = 'second'; name = 'Second site'; port = 8091 }
            )
          }
          [IO.File]::WriteAllText((Join-Path $data 'sites.json'), ($registry | ConvertTo-Json -Depth 5))

          $launcher = Start-Process -FilePath (Join-Path $pack 'node.exe') -ArgumentList (Join-Path $pack 'windows\launch.js'),'--no-open' -PassThru -NoNewWindow
          try {
            $both = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 3
              $legacy = $false
              $second = $false
              try { $legacy = (Invoke-RestMethod 'http://127.0.0.1:8090/api/health' -TimeoutSec 4).code -eq 200 } catch { }
              try { $second = (Invoke-RestMethod 'http://127.0.0.1:8091/api/health' -TimeoutSec 4).code -eq 200 } catch { }
              if ($legacy -and $second) { $both = $true; break }
            }
            if (-not $both) {
              Get-ChildItem (Join-Path $data 'logs') -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host "--- $($_.Name) ---"
                Get-Content $_.FullName -Tail 30
              }
              throw 'The second site never answered on :8091'
            }
            Write-Host 'Both sites answer on :8090 and :8091'

            if (-not (Test-Path (Join-Path $data 'pb_data\data.db'))) { throw 'The original database is gone' }
            if ((Get-Content $probe -Raw) -ne 'written before the second start') { throw 'The original data folder was modified' }
            if (-not (Test-Path (Join-Path (Join-Path $data 'pb_public\backups') $oldBackup.Name))) { throw 'The old backup was not preserved' }
            if (-not (Test-Path (Join-Path $data 'sites\second\pb_data\data.db'))) { throw 'The second site has no database of its own' }
            Write-Host 'The original folder is intact and the second site has its own database'

            $login = Invoke-RestMethod 'http://127.0.0.1:8080/api/login' -Method Post -ContentType 'application/json' -Body '{"pin":"1234"}'
            $status = Invoke-RestMethod 'http://127.0.0.1:8080/api/status' -Headers @{ 'X-Pocket-Token' = $login.token }
            Write-Host "sites: $($status.sites | ForEach-Object { $_.id + ':' + $_.port } | Join-String -Separator ' ')"
            if ($status.sites.Count -ne 2) { throw "The panel reported $($status.sites.Count) sites" }
            if ($status.sitePort -ne 8090) { throw "The panel's primary site is on $($status.sitePort)" }
          }
          finally {
            if ($launcher -and -not $launcher.HasExited) { taskkill /PID $launcher.Id /T /F | Out-Null }
            Start-Sleep -Seconds 2
            Get-Process pocketbase, cloudflared -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/PocketServer-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_B64: ${{ secrets.POCKET_SERVER_KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.POCKET_SERVER_STOREPASS }}
      KEY_PASS: ${{ secrets.POCKET_SERVER_KEYPASS }}
      KEY_ALIAS: ${{ secrets.POCKET_SERVER_KEYALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already carries the Android SDK with accepted licences;
      # android-actions/setup-android fails on the current command-line tools, which no
      # longer ship a `tools` package.
      - name: Check the Android SDK
        run: |
          echo "SDK: $ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" | tail -3

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install the panel's runtime dependencies
        run: node scripts/install-panel-deps.mjs

      - name: Copy the web UI into the Android project
        run: npm run cap:sync

      # Release APKs must be signed, and build.gradle fails the build on purpose when
      # no key is present. With no secrets (forks, pull requests) only debug is built.
      - name: Unpack the signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "POCKET_SERVER_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "POCKET_SERVER_STOREPASS=$KEYSTORE_PASS"
            echo "POCKET_SERVER_KEYALIAS=${KEY_ALIAS:-pocketserver}"
            echo "POCKET_SERVER_KEYPASS=$KEY_PASS"
          } >> "$GITHUB_ENV"

      # The registry decides what the phone starts: with no sites.json it must resolve to
      # exactly one site on 8090 in the original pb_data/pb_public folders.
      - name: Check the site registry
        run: |
          cd android
          ./gradlew testLiteDebugUnitTest --no-daemon

      - name: Build
        run: |
          cd android
          if [ -n "${POCKET_SERVER_KEYSTORE:-}" ]; then
            ./gradlew assembleLiteRelease assembleFullRelease --no-daemon
          else
            echo "No signing key in this run - building debug APKs only."
          fi
          ./gradlew assembleLiteDebug assembleFullDebug --no-daemon

      - name: Check the APKs
        run: |
          set -euo pipefail
          cd android/app/build/outputs/apk
          find . -name '*.apk' -print
          count=$(find . -name '*.apk' | wc -l)
          if [ "$count" -lt 2 ]; then echo "Expected at least two APKs, got $count"; exit 1; fi
          echo "versionCode $(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' ../../../build.gradle | head -1)"
          signer=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          for apk in $(find . -name '*-release.apk'); do
            if [ -n "$signer" ]; then
              "$signer" verify "$apk" > /dev/null
            else
              unzip -l "$apk" | grep -Eq 'META-INF/[^/]+\.(RSA|DSA|EC)'
            fi
            echo "signed: $apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
          # Nothing checks the repository out in this job, and gh refuses to guess which
          # repository to publish to outside a git tree, so name it explicitly.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          find assets -type f -print
          # The APKs arrive inside their flavor folders, so `assets/*` would hand gh the
          # folders themselves instead of the files.
          mapfile -t files < <(find assets -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then echo 'No assets were downloaded'; exit 1; fi
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "Pocket Server ${TAG#v}" --notes "Built from $GITHUB_SHA by GitHub Actions."
          gh release upload "$TAG" "${files[@]}" --clobber
